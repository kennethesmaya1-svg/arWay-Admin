<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus AR Admin - Buildings</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div>
      <div class="sidebar-brand"><i class="ti ti-map-pin"></i><span>Campus AR Navigation</span></div>
      <div class="sidebar-sub">Admin console</div>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-link active" data-view="buildings"><i class="ti ti-building"></i>Buildings</button>
      <button class="sidebar-link" id="change-password-btn"><i class="ti ti-lock"></i>Change password</button>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-link" id="logout-btn"><i class="ti ti-logout"></i>Log out</button>
    </div>
  </aside>

  <main class="main">

    <div class="topbar">
      <h1>Buildings</h1>
      <div class="topbar-actions">
        <div class="search-box">
          <i class="ti ti-search"></i>
          <input type="text" id="search-input" placeholder="Search buildings">
        </div>
        <button class="btn btn-primary" id="add-building-btn"><i class="ti ti-plus"></i>Add building</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="label">Buildings</div>
        <div class="value" id="stat-total">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Facilities tagged</div>
        <div class="value" id="stat-facilities">-</div>
      </div>
      <div class="stat-card">
        <div class="label">Last updated</div>
        <div class="value" id="stat-updated">-</div>
      </div>
    </div>

    <div class="building-grid" id="building-grid">
      <!-- building cards are rendered here by js/dashboard.js -->
    </div>

  </main>

  <nav class="mobile-nav">
    <button class="active"><i class="ti ti-building"></i></button>
    <button id="mobile-password-btn"><i class="ti ti-lock"></i></button>
    <button id="mobile-logout-btn"><i class="ti ti-logout"></i></button>
  </nav>

</div>

<!-- Add / Edit drawer -->
<div class="drawer-overlay hidden" id="form-drawer-overlay">
  <div class="drawer">
    <div class="drawer-header">
      <h2 id="form-drawer-title">Add building</h2>
      <button class="drawer-close" id="form-drawer-close"><i class="ti ti-x"></i></button>
    </div>
    <form id="building-form" class="drawer-body" enctype="multipart/form-data">
      <div id="form-error" class="form-error hidden"></div>

      <input type="hidden" id="building-id" name="id">

      <div class="field">
        <label for="building-name">Building name</label>
        <input type="text" id="building-name" name="name" required>
      </div>

      <div class="field">
        <label for="destination-type">Destination type</label>
        <select id="destination-type" name="destination_type" required>
          <option value="building">Building</option>
          <option value="office_facility">Office/Facility</option>
        </select>
      </div>

      <div class="field">
        <label for="building-node-id">Building node ID</label>
        <select id="building-node-id" name="building_node_id">
          <option value="">Select a building node</option>
          <option value="Node-01">Node-01(poi)</option>
          <option value="Node-02">Node-02(poi)</option>
          <option value="Node-03">Node-03(poi)</option>
          <option value="Node-04">Node-04(poi)</option>
          <option value="Node-05">Node-05(poi)</option>
          <option value="Node-06">Node-06(poi)</option>
          <option value="Node-07">Node-07(poi)</option>
          <option value="Node-08">Node-08(poi)</option>
          <option value="Node-09">Node-09(poi)</option>
          <option value="Node-10">Node-10(poi)</option>
          <option value="Node-11">Node-11(poi)</option>
          <option value="Node-12">Node-12(poi)</option>
          <option value="Node-13">Node-13(poi)</option>
          <option value="Node-14">Node-14(waypoint)</option>
          <option value="Node-15">Node-15(poi)</option>
          <option value="Node-16">Node-16(poi)</option>
          <option value="Node-17">Node-17(poi)</option>
          <option value="Node-18">Node-18(waypoint)</option>
          <option value="Node-19">Node-19(poi)</option>
          <option value="Node-20">Node-20(waypoint)</option>
          <option value="Node-21">Node-21(poi)</option>
          <option value="Node-22">Node-22(poi)</option>
          <option value="Node-23">Node-23(poi)</option>
          <option value="Node-24">Node-24(poi)</option>
          <option value="Node-25">Node-25(waypoint)</option>
          <option value="Node-26">Node-26(poi)</option>
          <option value="Node-27">Node-27(waypoint)</option>
          <option value="Node-28">Node-28(waypoint)</option>
          <option value="Node-29">Node-29(poi)</option>
          <option value="Node-30">Node-30(poi)</option>
          <option value="Node-31">Node-31(poi)</option>
          <option value="Node-32">Node-32(poi)</option>
          <option value="Node-33">Node-33(waypoint)</option>
          <option value="Node-34">Node-34(waypoint)</option>
        </select>
      </div>

      <div class="field">
        <label for="building-description">Description</label>
        <textarea id="building-description" name="description" rows="4"></textarea>
      </div>

      <div class="field">
        <label>Building image</label>
        <label class="image-drop" id="image-drop">
          <img id="image-preview" class="hidden" alt="">
          <span id="image-drop-label"><i class="ti ti-upload"></i> Click to upload an image</span>
          <input type="file" id="image-input" name="image" accept="image/jpeg,image/png,image/webp">
        </label>
      </div>

      <div class="field">
        <label for="facility-input">Facilities</label>
        <div class="facility-input-row">
          <input type="text" id="facility-input" placeholder="e.g. Wi-Fi, then press Enter">
          <button type="button" class="btn btn-ghost" id="facility-add-btn"><i class="ti ti-plus"></i></button>
        </div>
        <div class="chip-row" id="facility-chip-row"></div>
        <div class="facility-hint">Optional - add any facilities this building has.</div>
        <input type="hidden" id="facilities-json" name="facilities" value="[]">
      </div>
    </form>
    <div class="drawer-footer">
      <button type="button" class="btn btn-ghost" id="form-cancel-btn">Cancel</button>
      <button type="submit" form="building-form" class="btn btn-primary" id="form-save-btn">Save building</button>
    </div>
  </div>
</div>

<!-- View drawer -->
<div class="drawer-overlay hidden" id="view-drawer-overlay">
  <div class="drawer">
    <div class="drawer-header">
      <h2 id="view-drawer-title">Building details</h2>
      <button class="drawer-close" id="view-drawer-close"><i class="ti ti-x"></i></button>
    </div>
    <div class="drawer-body">
      <img class="view-detail-image" id="view-image" alt="">
      <p class="view-detail-desc" id="view-description"></p>
      <div class="chip-row" id="view-facilities"></div>
    </div>
  </div>
</div>

<!-- Delete confirmation -->
<div class="modal-overlay hidden" id="delete-modal-overlay">
  <div class="modal-card">
    <h3>Delete this building?</h3>
    <p id="delete-modal-text">This removes it from the AR navigation app and can't be undone.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="delete-cancel-btn">Cancel</button>
      <button class="btn btn-danger" id="delete-confirm-btn">Delete</button>
    </div>
  </div>
</div>

<!-- Change password -->
<div class="modal-overlay hidden" id="password-modal-overlay">
  <div class="modal-card">
    <h3>Change password</h3>
    <form id="password-form" style="display:flex;flex-direction:column;gap:14px;">
      <div id="password-error" class="form-error hidden"></div>
      <div class="field">
        <label for="current-password">Current password</label>
        <div class="password-input-wrap">
          <input type="password" id="current-password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" data-password-target="current-password" aria-label="Show current password" title="Show password"><i class="ti ti-eye"></i></button>
        </div>
      </div>
      <div class="field">
        <label for="new-password">New password</label>
        <div class="password-input-wrap">
          <input type="password" id="new-password" autocomplete="new-password" minlength="6" required>
          <button type="button" class="password-toggle" data-password-target="new-password" aria-label="Show new password" title="Show password"><i class="ti ti-eye"></i></button>
        </div>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm new password</label>
        <div class="password-input-wrap">
          <input type="password" id="confirm-password" autocomplete="new-password" minlength="6" required>
          <button type="button" class="password-toggle" data-password-target="confirm-password" aria-label="Show confirmed password" title="Show password"><i class="ti ti-eye"></i></button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="password-cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="password-save-btn">Update password</button>
      </div>
    </form>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
